# 可选：仅当你把 Pages 的 Source 设为「GitHub Actions」时使用。
# 默认推荐用 deploy-github-pages.yml（push → gh-pages 分支），不要用本文件与之一同自动 push。
#
# 手动运行：Actions → Deploy static content to Pages → Run workflow。
# Pages：Settings → Pages → Source = GitHub Actions。

name: Deploy static content to Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: ${{ github.event.repository.name }}

      - name: Verify dist (catch blank-page 404s)
        run: npm run verify:pages-dist
        env:
          VITE_BASE_PATH: ${{ github.event.repository.name }}

      - name: Log deploy diagnostics
        run: |
          echo "repository=${{ github.repository }} name=${{ github.event.repository.name }}"
          ls -la dist | head -25
          echo "--- index.html (first lines) ---"
          head -30 dist/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
